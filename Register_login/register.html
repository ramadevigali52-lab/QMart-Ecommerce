<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./register.css" />
</head>
<body>
    <div class="container">
    <div class="card">
      <h2>Create Account</h2>
      <p class="subtitle">Please fill in your details to register</p>

      <form id="registerForm">
        <label>Full Name</label>
        <input type="text" id="fullName" placeholder="Mohit" required>

        <label>Email Address</label>
        <input type="email" id="email" placeholder="mohit@gmail.com" required>

        <label>Password</label>
        <input type="password" id="password" placeholder="........" required>

        <label>Mobile Number</label>
        <input type="tel" id="mobile" placeholder="+91 XXXXXXXXXX" required>

        <button type="submit" class="register-btn">Register</button>
      </form>

      <p class="login-text">Already have an account? <a href="login.html">SignIn</a></p>
      <p class="footer">© 2025 Your Company. All rights reserved.</p>
    </div>
  </div>
  <script src="register.js"></script>
   
</body>
</html>
